name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Compute and apply the next CalVer version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python3 -m scripts.set_version --next-from-tags)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin HEAD:master

      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"
          # dist/ isn't committed (it's gitignored, built fresh here) - HACS
          # installs this card as a release asset, not from the tagged tree,
          # so the built bundle has to be attached here or there is nothing
          # for HACS to fetch at all.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes dist/decluttering-card.js
