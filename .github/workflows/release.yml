name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Compute and apply the next CalVer version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python3 -m scripts.set_version --next-from-tags)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # Must run after the version bump above: this card's own version
        # banner is baked in from package.json at build time (`import * as
        # pjson from '../package.json'`), so building first would ship a
        # bundle whose embedded version string lags the tag it's attached to
        # (found 2026-09-07: v2026.09.07.2's release asset still reported
        # itself as 2026.09.07.1).
        run: |
          npm run build
          npm test

      - name: Commit the version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          # package.json may already read as today's next version (e.g. a
          # manual local bump ahead of the first release run for the day) -
          # nothing to commit is not a failure, the tag/release step below
          # still needs to run.
          git diff --staged --quiet && echo "package.json already at v${{ steps.version.outputs.version }}, nothing to commit" || git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin HEAD:master

      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"
          # dist/ isn't committed (it's gitignored, built fresh here) - HACS
          # installs this card as a release asset, not from the tagged tree,
          # so the built bundle has to be attached here or there is nothing
          # for HACS to fetch at all.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes dist/decluttering-card.js
